<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    /* Matches the navbar logo, which is dark on light and inverted in dark mode. */
    @media (prefers-color-scheme: dark) { #mark { filter: invert(1); } }
  </style>
  <image id="mark" width="128" height="128" href="data:image/png;base64,"/>
</svg>
